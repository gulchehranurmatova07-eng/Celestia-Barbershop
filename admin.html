<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELESTIA — Админ-панель</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{ overflow-x: hidden; }
  .admin-shell{ min-height: 100vh; display: flex; flex-direction: column; }
  .admin-header{
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--line-soft); background: rgba(18,16,9,.92);
  }
  .admin-header .brand__text{ font-size: 18px; }
  .admin-main{ flex: 1; padding: 36px 24px 60px; max-width: 1180px; margin: 0 auto; width: 100%; }

  .admin-login{ max-width: 380px; margin: 10vh auto; text-align: center; }
  .admin-login .brand__icon{ width: 56px; height: 56px; margin: 0 auto 18px; display: block; }
  .admin-login h1{ font-family: var(--serif); font-size: 26px; margin: 0 0 8px; }
  .admin-login p{ color: var(--text-dim); font-size: 14px; margin: 0 0 24px; }
  .admin-login form{ display: flex; flex-direction: column; gap: 14px; }

  .admin-stats{ display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .admin-stat{ background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 18px; }
  .admin-stat__num{ font-family: var(--serif); font-size: 28px; color: var(--gold-bright); font-weight: 700; }
  .admin-stat__label{ color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }

  .admin-toolbar{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .admin-toolbar h2{ font-family: var(--serif); font-size: 20px; margin: 0; }

  .admin-table-wrap{ overflow-x: auto; border: 1px solid var(--line-soft); border-radius: var(--radius); }
  table.admin-table{ width: 100%; border-collapse: collapse; min-width: 880px; font-size: 13.5px; }
  .admin-table thead th{
    text-align: left; padding: 12px 14px; background: var(--bg-card); color: var(--text-faint);
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
  }
  .admin-table tbody td{ padding: 12px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .admin-table tbody tr:hover{ background: rgba(255,255,255,.02); }
  .admin-table tbody tr:last-child td{ border-bottom: none; }
  .admin-table .num{ color: var(--text-faint); font-size: 12px; }
  .admin-table .price{ color: var(--gold-bright); font-weight: 700; white-space: nowrap; }
  .admin-table .phone a{ color: var(--text); font-weight: 600; }
  .admin-table .phone a:hover{ color: var(--gold-bright); }

  .admin-empty{ text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .admin-error{ color: var(--danger); background: rgba(226,114,91,.1); border: 1px solid rgba(226,114,91,.3); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13.5px; margin-bottom: 18px; }
  [hidden]{ display: none !important; }
</style>
</head>
<body>

<div class="admin-shell">
  <header class="admin-header">
    <a href="index.html" class="brand">
      <img class="brand__icon" src="assets/logo-icon-160.png" alt="" width="32" height="32">
      <span class="brand__text">CELESTIA · Админ</span>
    </a>
    <button class="btn btn--outline btn--sm" id="logoutBtn" hidden>Выйти</button>
  </header>

  <main class="admin-main">

    <section class="admin-login" id="loginView">
      <img class="brand__icon" src="assets/logo-icon-160.png" alt="">
      <h1>Вход в админ-панель</h1>
      <p>Введите пароль, заданный в переменной окружения ADMIN_PASSWORD на Vercel.</p>
      <p class="admin-error" id="loginError" hidden></p>
      <form id="loginForm">
        <div class="field">
          <label for="pwd">Пароль</label>
          <input type="password" id="pwd" name="pwd" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--gold">Войти</button>
      </form>
    </section>

    <section id="dashboardView" hidden>
      <div class="admin-stats" id="adminStats"></div>

      <div class="admin-toolbar">
        <h2>Последние записи</h2>
        <button class="btn btn--ghost btn--sm" id="refreshBtn">Обновить</button>
      </div>

      <p class="admin-error" id="dashError" hidden></p>

      <div id="tableArea"></div>
    </section>

  </main>
</div>

<script>
(function(){
  'use strict';
  const $ = (s) => document.querySelector(s);
  const STORAGE_KEY = 'celestia_admin_pwd';

  function formatSum(n){ return Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ') + ' сум'; }
  function formatDate(iso){
    try {
      const d = new Date(iso);
      return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch { return iso || '—'; }
  }

  function showLogin(message){
    $('#loginView').hidden = false;
    $('#dashboardView').hidden = true;
    $('#logoutBtn').hidden = true;
    if (message){
      $('#loginError').textContent = message;
      $('#loginError').hidden = false;
    }
  }

  function showDashboard(){
    $('#loginView').hidden = true;
    $('#dashboardView').hidden = false;
    $('#logoutBtn').hidden = false;
  }

  function renderStats(bookings){
    const total = bookings.length;
    const revenue = bookings.reduce((s, b) => s + (Number(b.total) || 0), 0);
    const today = new Date().toDateString();
    const todayCount = bookings.filter(b => new Date(b.createdAt).toDateString() === today).length;
    $('#adminStats').innerHTML = `
      <div class="admin-stat"><div class="admin-stat__num">${total}</div><div class="admin-stat__label">Всего записей</div></div>
      <div class="admin-stat"><div class="admin-stat__num">${todayCount}</div><div class="admin-stat__label">Сегодня</div></div>
      <div class="admin-stat"><div class="admin-stat__num">${formatSum(revenue)}</div><div class="admin-stat__label">Сумма по всем записям</div></div>
    `;
  }

  function renderTable(bookings){
    if (!bookings.length){
      $('#tableArea').innerHTML = '<div class="admin-empty">Пока нет ни одной записи.</div>';
      return;
    }
    const rows = bookings.map(b => `
      <tr>
        <td class="num">${b.id || '—'}</td>
        <td>${formatDate(b.createdAt)}</td>
        <td>${b.date || ''} ${b.time || ''}</td>
        <td>${b.barber || '—'}</td>
        <td>${b.services || '—'}</td>
        <td>${b.name || '—'}</td>
        <td class="phone"><a href="tel:${(b.phone || '').replace(/[^\d+]/g, '')}">${b.phone || '—'}</a></td>
        <td class="price">${formatSum(b.total)}</td>
      </tr>`).join('');
    $('#tableArea').innerHTML = `
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Номер</th><th>Создана</th><th>Дата визита</th><th>Мастер</th>
              <th>Услуги</th><th>Клиент</th><th>Телефон</th><th>Сумма</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  async function loadBookings(password){
    $('#dashError').hidden = true;
    try {
      const res = await fetch('/api/bookings', { headers: { 'X-Admin-Password': password } });
      if (res.status === 401){
        sessionStorage.removeItem(STORAGE_KEY);
        showLogin('Неверный пароль.');
        return;
      }
      const data = await res.json();
      if (!res.ok || !data.ok){
        showDashboard();
        $('#dashError').textContent = data.error || 'Не удалось загрузить записи.';
        $('#dashError').hidden = false;
        return;
      }
      const bookings = (data.bookings || []).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderStats(bookings);
      renderTable(bookings);
      showDashboard();
    } catch (e) {
      $('#dashError').textContent = 'Сервер недоступен. Эта страница работает только после деплоя на Vercel с подключённым хранилищем.';
      $('#dashError').hidden = false;
      showDashboard();
    }
  }

  $('#loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const pwd = $('#pwd').value.trim();
    if (!pwd) return;
    sessionStorage.setItem(STORAGE_KEY, pwd);
    loadBookings(pwd);
  });

  $('#refreshBtn').addEventListener('click', () => {
    const pwd = sessionStorage.getItem(STORAGE_KEY);
    if (pwd) loadBookings(pwd);
  });

  $('#logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(STORAGE_KEY);
    showLogin();
  });

  const savedPwd = sessionStorage.getItem(STORAGE_KEY);
  if (savedPwd) loadBookings(savedPwd);
  else showLogin();
})();
</script>
</body>
</html>
